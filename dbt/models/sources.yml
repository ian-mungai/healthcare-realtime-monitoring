version: 2

sources:
  - name: healthcare_realtime
    database: "{{ env_var('ATHENA_CATALOG') }}"
    schema: "{{ env_var('ATHENA_SOURCE_DATABASE') }}"
    tables:
      - name: processed_fhir_observations
        identifier: "{{ env_var('ATHENA_PROCESSED_TABLE') }}"
        description: Processed FHIR vital-sign observations stored as an Apache Iceberg table.
        config:
          loaded_at_field: received_at
          freshness:
            warn_after: {count: 26, period: hour}
        columns:
          - name: observation_id
            tests:
              - not_null
          - name: loinc_code
            tests:
              - not_null
          - name: patient_id
            tests:
              - not_null
  - name: cohort_reference
    description: >-
      Cohort reference rows from jobs/cohort_reference/extract.py and the local loader: Synthea demographics and payer
      history, facilities, the simulator's admissions from HAPI FHIR and the waveform split groups. Enabled with the
      cohort_reference_enabled variable (on for the local warehouse; on AWS once the extract is deployed).
    database: "{{ env_var('ATHENA_CATALOG') }}"
    schema: "{{ env_var('ATHENA_SOURCE_DATABASE') }}"
    config:
      enabled: "{{ var('cohort_reference_enabled', false) }}"
    tables:
      - name: fhir_patients
        columns:
          - name: patient_id
            tests:
              - not_null
              - unique
      - name: patient_payer_history
        columns:
          - name: patient_id
            tests:
              - not_null
      - name: facilities
        columns:
          - name: facility_id
            tests:
              - not_null
              - unique
      - name: admissions
        columns:
          - name: encounter_id
            tests:
              - not_null
              - unique
      - name: patient_split_groups
        columns:
          - name: patient_id
            tests:
              - not_null
              - unique
  - name: model_serving
    database: "{{ env_var('ATHENA_CATALOG') }}"
    schema: "{{ env_var('ATHENA_ML_DATABASE') }}"
    tables:
      - name: ml_predictions_published
        identifier: "{{ env_var('ATHENA_PREDICTIONS_PUBLISHED_TABLE') }}"
        description: Versioned logistic-regression predictions published by the approved-model scoring task.
        config:
          loaded_at_field: scored_at
          freshness:
            warn_after: {count: 26, period: hour}
        columns:
          - name: model_version
            tests:
              - not_null
          - name: encounter_key
            tests:
              - not_null
