version: 2

models:
  - name: dim_patient
    description: Conformed patient dimension for synthetic FHIR subjects.

    columns:
      - name: patient_key
        tests:
          - not_null
          - unique

      - name: patient_id
        tests:
          - not_null
          - unique

  - name: dim_observation_type
    description: Conformed LOINC vital-sign observation type dimension.

    columns:
      - name: observation_type_key
        tests:
          - not_null
          - unique

      - name: observation_type
        tests:
          - not_null

      - name: loinc_code
        tests:
          - not_null
          - unique

  - name: dim_encounter
    description: Encounter analysis windows for the configured active cohort, derived from the first and last observation timestamps.

    columns:
      - name: encounter_key
        tests:
          - not_null
          - unique

      - name: patient_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_key

      - name: patient_id
        tests:
          - not_null

      - name: encounter_id
        tests:
          - not_null

      - name: provider_version_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_version_key

      - name: encounter_start_at
        tests:
          - not_null

      - name: encounter_end_at
        tests:
          - not_null

  - name: dim_provider
    description: Type 2 provider dimension using an NPPES-compatible synthetic fixture for the portfolio cohort.

    columns:
      - name: provider_version_key
        tests:
          - not_null
          - unique

      - name: provider_key
        tests:
          - not_null

      - name: provider_npi
        tests:
          - not_null

      - name: valid_from
        tests:
          - not_null

      - name: is_current
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: dim_date
    description: Role-playing observation date dimension derived from available event dates.

    columns:
      - name: date_key
        tests:
          - not_null
          - unique

      - name: full_date
        tests:
          - not_null
          - unique

  - name: fact_observations
    description: Vital-sign measurement fact at one row per observation ID and LOINC code.

    columns:
      - name: fact_observation_key
        tests:
          - not_null
          - unique

      - name: patient_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_key

      - name: encounter_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_encounter')
                field: encounter_key

      - name: provider_version_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_version_key

      - name: observation_type_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_observation_type')
                field: observation_type_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: observation_id
        tests:
          - not_null

      - name: patient_id
        tests:
          - not_null

      - name: encounter_id
        description: Required encounter associated with the source FHIR Observation.
        tests:
          - not_null

      - name: loinc_code
        tests:
          - not_null

      - name: value
        tests:
          - not_null

  - name: dim_patient_version
    description: >-
      Type 2 patient dimension with Synthea demographics. A new version starts whenever the patient's insurance payer
      changes in their Synthea claims history. Built when cohort_reference_enabled is true.

    columns:
      - name: patient_version_key
        tests:
          - not_null
          - unique

      - name: patient_key
        tests:
          - not_null

      - name: payer_name
        tests:
          - not_null

      - name: valid_from
        tests:
          - not_null

  - name: dim_facility
    description: Synthea hospitals where the simulator places its admissions. Built when cohort_reference_enabled is true.

    columns:
      - name: facility_key
        tests:
          - not_null
          - unique

      - name: facility_name
        tests:
          - not_null

  - name: dim_unit
    description: >-
      One row per facility and inpatient unit, with the unit's care level from the hospital_units seed (critical,
      intermediate or acute). Built when cohort_reference_enabled is true.

    columns:
      - name: unit_key
        tests:
          - not_null
          - unique

      - name: facility_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_facility')
                field: facility_key

      - name: care_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['critical', 'intermediate', 'acute']

  - name: fact_admissions
    description: >-
      One row per simulated admission: facility, unit, admit and discharge times and a synthetic admitting diagnosis
      drawn from the patient's Synthea conditions. Built when cohort_reference_enabled is true.

    columns:
      - name: admission_key
        tests:
          - not_null
          - unique

      - name: patient_version_key
        description: The patient version valid on the admission date.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient_version')
                field: patient_version_key

      - name: provider_version_key
        description: >-
          The attending provider's version valid on the admission date, from the synthetic roster
          (scripts/nppes/provider_roster.py). Its specialty is a negative control for the subgroup analysis.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_version_key

      - name: attending_specialty
        tests:
          - not_null

      - name: facility_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_facility')
                field: facility_key

      - name: unit_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_unit')
                field: unit_key

      - name: unit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Medical intensive care unit', 'Step-down unit', 'Medical-surgical ward']

      - name: length_of_stay_hours
        tests:
          - not_null

      - name: diagnosis_code
        tests:
          - not_null

      - name: diagnosis_source
        description: synthea_history when the diagnosis is one of the patient's Synthea disorders; simulator_fallback otherwise.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['synthea_history', 'simulator_fallback']
