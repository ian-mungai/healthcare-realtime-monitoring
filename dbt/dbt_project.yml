name: healthcare_realtime
version: "1.0.0"
config-version: 2

profile: healthcare_realtime

vars:
  feature_window_minutes: 15
  outcome_window_minutes: 15
  deterioration_min_repeated_extreme_observations: 2
  vital_sign_loinc_codes:
    heart_rate: "8867-4"
    respiratory_rate: "9279-1"
    spo2: "2708-6"
    systolic_bp: "8480-6"
    diastolic_bp: "8462-4"

model-paths:
  - models

test-paths:
  - tests

macro-paths:
  - macros

clean-targets:
  - target
  - dbt_packages

models:
  healthcare_realtime:
    staging:
      +materialized: view
      stg_fhir_observations:
        +alias: "{{ env_var('DBT_STAGING_TABLE') }}"

    marts:
      core:
        +materialized: table
        +table_type: iceberg
        +format: parquet
        dim_patient:
          +alias: "{{ env_var('DBT_DIM_PATIENT_TABLE') }}"
        dim_encounter:
          +alias: "{{ env_var('DBT_DIM_ENCOUNTER_TABLE') }}"
        dim_provider:
          +alias: "{{ env_var('DBT_DIM_PROVIDER_TABLE') }}"
        dim_observation_type:
          +alias: "{{ env_var('DBT_DIM_OBSERVATION_TYPE_TABLE') }}"
        dim_date:
          +alias: "{{ env_var('DBT_DIM_DATE_TABLE') }}"
        fact_observations:
          +alias: "{{ env_var('DBT_FACT_OBSERVATIONS_TABLE') }}"

      analytics:
        +materialized: table
        +table_type: iceberg
        +format: parquet
        fact_encounter_vital_features:
          +alias: "{{ env_var('DBT_ENCOUNTER_FEATURES_TABLE') }}"
        ml_training_dataset:
          +alias: "{{ env_var('DBT_ML_TRAINING_TABLE') }}"
        ml_scoring_dataset:
          +alias: "{{ env_var('DBT_ML_SCORING_TABLE') }}"
        ml_predictions_serving:
          +alias: "{{ env_var('DBT_ML_PREDICTIONS_SERVING_TABLE') }}"
        ml_predictions_latest:
          +alias: "{{ env_var('DBT_ML_PREDICTIONS_LATEST_TABLE') }}"

seeds:
  healthcare_realtime:
    provider_history:
      +column_types:
        provider_npi: varchar
        provider_name: varchar
        taxonomy_code: varchar
        taxonomy_description: varchar
        provider_state: varchar
        valid_from: varchar
        valid_to: varchar
        is_current: boolean
        data_source: varchar
