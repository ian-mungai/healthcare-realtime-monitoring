healthcare_realtime_pipeline:
  dag_id: healthcare_realtime_pipeline
  tasks:
    check_raw_data:
      operator: airflow.providers.amazon.aws.sensors.s3.S3KeySensor
      bucket_name: imungai-healthcare-realtime
      bucket_key: raw/fhir_observations/*
      wildcard_match: true
      poke_interval: 10.0
      timeout: 300.0
      retries: 2
      retry_delay: 60
      dependencies: []
    run_glue_job:
      operator: airflow.providers.amazon.aws.operators.glue.GlueJobOperator
      job_name: healthcare_realtime_raw_to_processed
      wait_for_completion: false
      retries: 2
      retry_delay: 60
      dependencies:
      - check_raw_data
    wait_for_glue_job:
      operator: airflow.providers.amazon.aws.sensors.glue.GlueJobSensor
      job_name: healthcare_realtime_raw_to_processed
      run_id: '{{ ti.xcom_pull(task_ids=''run_glue_job'') }}'
      poke_interval: 15
      timeout: 1800.0
      retries: 2
      retry_delay: 60
      dependencies:
      - run_glue_job
    validate_processed_data:
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable: lib.athena_lineage.run_athena_validation
      retries: 2
      retry_delay: 60
      dependencies:
      - wait_for_glue_job
    run_dbt_build:
      operator: airflow.providers.amazon.aws.operators.ecs.EcsRunTaskOperator
      cluster: healthcare-realtime-data-jobs
      task_definition: arn:aws:ecs:us-east-1:<aws-account-id>:task-definition/healthcare_realtime_dbt:2
      launch_type: FARGATE
      overrides: {}
      wait_for_completion: true
      network_configuration:
        awsvpcConfiguration:
          subnets:
          - subnet-ci-a
          - subnet-ci-b
          securityGroups:
          - sg-ci-placeholder-a
          assignPublicIp: DISABLED
      retries: 2
      retry_delay: 60
      dependencies:
      - validate_processed_data
    run_soda_checks:
      operator: airflow.providers.amazon.aws.operators.ecs.EcsRunTaskOperator
      cluster: healthcare-realtime-data-jobs
      task_definition: arn:aws:ecs:us-east-1:<aws-account-id>:task-definition/healthcare_realtime_soda:2
      launch_type: FARGATE
      overrides: {}
      wait_for_completion: true
      network_configuration:
        awsvpcConfiguration:
          subnets:
          - subnet-ci-a
          - subnet-ci-b
          securityGroups:
          - sg-ci-placeholder-b
          assignPublicIp: DISABLED
      retries: 2
      retry_delay: 60
      dependencies:
      - run_dbt_build
