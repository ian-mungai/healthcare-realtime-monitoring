dataset: ${env.SODA_DATA_SOURCE_NAME}/${env.ATHENA_CATALOG}/${env.ATHENA_DBT_DATABASE}/${env.DBT_DIM_ENCOUNTER_TABLE}

checks:
  - row_count:
      threshold:
        must_be_greater_than: 0

columns:
  - name: encounter_key
    checks:
      - missing:
      - duplicate:

  - name: patient_key
    checks:
      - missing:

  - name: patient_id
    checks:
      - missing:

  - name: provider_version_key
    checks:
      - missing:

  - name: encounter_start_at
    checks:
      - missing:

  - name: encounter_end_at
    checks:
      - missing:
