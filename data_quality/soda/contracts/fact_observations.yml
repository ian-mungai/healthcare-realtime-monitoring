dataset: ${env.SODA_DATA_SOURCE_NAME}/${env.ATHENA_CATALOG}/${env.ATHENA_DBT_DATABASE}/${env.DBT_FACT_OBSERVATIONS_TABLE}

checks:
  - row_count:
      threshold:
        must_be_greater_than: 0
  - duplicate:
      columns:
        - observation_id
        - loinc_code
      threshold:
        must_be: 0

columns:
  - name: fact_observation_key
    checks:
      - missing:
      - duplicate:

  - name: patient_key
    checks:
      - missing:

  - name: encounter_key
    checks:
      - missing:

  - name: provider_version_key
    checks:
      - missing:

  - name: observation_type_key
    checks:
      - missing:

  - name: date_key
    checks:
      - missing:

  - name: observation_id
    checks:
      - missing:

  - name: patient_id
    checks:
      - missing:

  - name: encounter_id
    checks:
      - missing:

  - name: loinc_code
    checks:
      - missing:

  - name: value
    checks:
      - missing:

  - name: effective_datetime
    checks:
      - missing:
