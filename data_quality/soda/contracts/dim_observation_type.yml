dataset: ${env.SODA_DATA_SOURCE_NAME}/${env.ATHENA_CATALOG}/${env.ATHENA_DBT_DATABASE}/${env.DBT_DIM_OBSERVATION_TYPE_TABLE}

checks:
  - row_count:
      threshold:
        must_be_greater_than: 0

columns:
  - name: observation_type_key
    checks:
      - missing:
      - duplicate:

  - name: observation_type
    checks:
      - missing:

  - name: loinc_code
    checks:
      - missing:
      - invalid:
          valid_values:
            - "8867-4"
            - "2708-6"
            - "8480-6"
            - "8462-4"
            - "9279-1"

  - name: code_system
    checks:
      - missing:
