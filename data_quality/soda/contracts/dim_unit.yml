dataset: ${env.SODA_DATA_SOURCE_NAME}/${env.ATHENA_CATALOG}/${env.ATHENA_DBT_DATABASE}/dim_unit

checks:
  - row_count:
      threshold:
        must_be_greater_than: 0

columns:
  - name: unit_key
    checks:
      - missing:
      - duplicate:

  - name: facility_key
    checks:
      - missing:

  - name: care_level
    checks:
      - missing:
      - invalid:
          valid_values:
            - critical
            - intermediate
            - acute
