dataset: ${env.SODA_DATA_SOURCE_NAME}/${env.ATHENA_CATALOG}/${env.ATHENA_DBT_DATABASE}/${env.DBT_ML_TRAINING_TABLE}

checks:
  - row_count:
      threshold:
        must_be_greater_than: 1

columns:
  - name: encounter_key
    checks:
      - missing:
      - duplicate:

  - name: patient_key
    checks:
      - missing:

  - name: deterioration_proxy_label
    checks:
      - missing:
      - invalid:
          valid_values:
            - 0
            - 1

  - name: feature_schema_version
    checks:
      - missing:

  - name: label_definition_version
    checks:
      - missing:

  - name: data_split
    checks:
      - missing:
      - invalid:
          valid_values:
            - train
            - test
