dataset: healthcare_realtime_athena/awsdatacatalog/healthcare_realtime_dbt/ml_predictions_serving

checks:
  - row_count:
      threshold:
        must_be_greater_than: 0
  - duplicate:
      columns:
        - model_version
        - encounter_key
      threshold:
        must_be: 0
  - freshness:
      column: scored_at
      threshold:
        must_be_less_than: 26
        unit: hour

columns:
  - name: model_version
    checks:
      - missing:

  - name: encounter_key
    checks:
      - missing:

  - name: patient_key
    checks:
      - missing:

  - name: deterioration_probability
    checks:
      - missing:
      - invalid:
          valid_min: 0
          valid_max: 1

  - name: predicted_label
    checks:
      - missing:
      - invalid:
          valid_values:
            - 0
            - 1

  - name: decision_threshold
    checks:
      - missing:
      - invalid:
          valid_min: 0
          valid_max: 1

  - name: feature_schema_version
    checks:
      - missing:

  - name: label_definition_version
    checks:
      - missing:

  - name: dataset_fingerprint
    checks:
      - missing:

  - name: scored_at
    checks:
      - missing:
