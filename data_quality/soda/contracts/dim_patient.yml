dataset: ${env.SODA_DATA_SOURCE_NAME}/${env.ATHENA_CATALOG}/${env.ATHENA_DBT_DATABASE}/${env.DBT_DIM_PATIENT_TABLE}

checks:
  - row_count:
      threshold:
        must_be_greater_than: 0

columns:
  - name: patient_key
    checks:
      - missing:
      - duplicate:

  - name: patient_id
    checks:
      - missing:
      - duplicate:

  - name: patient_reference
    checks:
      - missing:

  - name: source_system
    checks:
      - missing:

  - name: data_classification
    checks:
      - missing:
