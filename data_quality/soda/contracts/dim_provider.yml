dataset: ${env.SODA_DATA_SOURCE_NAME}/${env.ATHENA_CATALOG}/${env.ATHENA_DBT_DATABASE}/${env.DBT_DIM_PROVIDER_TABLE}

checks:
  - row_count:
      threshold:
        must_be_greater_than: 0
  - duplicate:
      columns:
        - provider_npi
        - valid_from
      threshold:
        must_be: 0

columns:
  - name: provider_version_key
    checks:
      - missing:
      - duplicate:

  - name: provider_key
    checks:
      - missing:

  - name: provider_npi
    checks:
      - missing:

  - name: valid_from
    checks:
      - missing:

  - name: is_current
    checks:
      - missing:
