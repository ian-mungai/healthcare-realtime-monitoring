dataset: ${env.SODA_DATA_SOURCE_NAME}/${env.ATHENA_CATALOG}/${env.ATHENA_DBT_DATABASE}/${env.DBT_DIM_DATE_TABLE}

checks:
  - row_count:
      threshold:
        must_be_greater_than: 0

columns:
  - name: date_key
    checks:
      - missing:
      - duplicate:

  - name: full_date
    checks:
      - missing:
      - duplicate:

  - name: calendar_year
    checks:
      - missing:

  - name: month_number
    checks:
      - missing:

  - name: day_of_month
    checks:
      - missing:
