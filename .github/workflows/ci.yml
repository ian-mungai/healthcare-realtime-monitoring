name: CI

on:
  workflow_dispatch:

  pull_request:

  push:
    branches:
      - main

jobs:
  python:
    name: Python Checks
    runs-on: ubuntu-latest
    env:
      AWS_REGION: example-region-1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt

      - name: Soda contract syntax
        run: |
          for contract in data_quality/soda/contracts/*.yml; do
            soda contract test --contract "$contract"
          done
      - name: Ruff
        run: |
          ruff check .

      - name: Ruff format
        run: |
          ruff format --check .

      - name: MyPy
        run: |
          python -m mypy .

      - name: Python tests with coverage
        run: |
          python -m pytest \
            tests \
            scripts/synthea_loader/tests/test_load_fhir.py \
            services/fhir_webhook/tests \
            services/vitals_simulator/tests \
            services/vitals_stream_processor/tests \
            services/vitals_replay/tests \
            services/vitals_api/tests \
            services/websocket_handler/tests \
            --cov \
            --cov-report=term-missing \
            -v

  terraform:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.0"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MWAA Serverless generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r airflow/serverless/requirements_dev.txt

      - name: Terraform Format
        run: |
          terraform fmt -check -recursive infra

      - name: Build Lambda packages
        run: |
          for builder in scripts/lambda/build_*.sh; do
            "$builder"
          done

      - name: Build Glue lineage package
        run: |
          ./scripts/glue/build_lineage_package.sh

      - name: Build MWAA Serverless code package
        run: |
          ./airflow/serverless/build_code_package.sh

      - name: Validate deployment packages
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          expected = {
              Path("build/lambda/fhir_webhook.zip"): {
                  "services/fhir_webhook/app/lambda_handler.py",
              },
              Path("build/lambda/vitals_stream_processor.zip"): {
                  "handler.py",
                  "schema.py",
              },
              Path("build/lambda/websocket_handler.zip"): {"handler.py"},
              Path("build/lambda/vitals_api.zip"): {"handler.py"},
              Path("build/lambda/vitals_replay.zip"): {"handler.py"},
              Path("tmp/healthcare_realtime_lineage.zip"): {
                  "lineage/openlineage/client.py",
                  "lineage/openlineage/glue_lineage.py",
              },
              Path("tmp/healthcare_realtime_mwaa_serverless_code.zip"): {
                  "lib/athena_lineage.py",
                  "lineage/openlineage/client.py",
                  "lineage/openlineage/athena_lineage.py",
              },
          }

          for path, required_members in expected.items():
              assert path.is_file() and path.stat().st_size > 0, f"Missing or empty package: {path}"
              with ZipFile(path) as archive:
                  bad_member = archive.testzip()
                  assert bad_member is None, f"Corrupt member in {path}: {bad_member}"
                  members = set(archive.namelist())
                  assert required_members <= members, f"Missing required members in {path}: {required_members - members}"
                  assert not any("__pycache__" in member or member.endswith(".pyc") for member in members)

          print("Deployment package validation passed.")
          PY

      - name: Generate MWAA Serverless workflow
        env:
          MWAA_SERVERLESS_START_DATE: "2099-01-01T00:00:00+00:00"
          AIRFLOW__DBT__ECS_SECURITY_GROUP: "sg-ci-placeholder"
          AIRFLOW__DBT__ECS_SUBNETS: "subnet-ci-a,subnet-ci-b"
          AIRFLOW__SODA__ECS_SECURITY_GROUP: "sg-ci-placeholder"
          AIRFLOW__SODA__ECS_SUBNETS: "subnet-ci-a,subnet-ci-b"
          DBT_ECS_TASK_DEFINITION: "arn:aws:ecs:example-region-1:111111111111:task-definition/healthcare_realtime_dbt:42"
          SODA_ECS_TASK_DEFINITION: "healthcare_realtime_soda:17"
          DATA_JOBS_ECS_CLUSTER: "healthcare-realtime-data-jobs"
          RAW_BUCKET: "ci-project-data-bucket"
        run: |
          PYTHONPATH="$PWD/airflow/dags:$PWD" python airflow/serverless/generate_healthcare_realtime_pipeline.py

      - name: Validate generated MWAA Serverless workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("airflow/serverless/generated/healthcare_realtime_pipeline.yaml")
          workflow = yaml.safe_load(path.read_text())
          definition = workflow["healthcare_realtime_pipeline"]
          tasks = definition["tasks"]

          assert definition["schedule"] == "0 2 * * *"
          assert definition["start_date"] == "2099-01-01T00:00:00+00:00"
          assert definition["max_active_runs"] == 1
          assert len(tasks) == 6
          assert tasks["validate_processed_data"]["operator"] == "airflow.providers.standard.operators.python.PythonOperator"
          assert tasks["validate_processed_data"]["python_callable"] == "lib.athena_lineage.run_athena_validation"
          assert tasks["run_dbt_build"]["task_definition"] == "healthcare_realtime_dbt"
          assert tasks["run_soda_checks"]["task_definition"] == "healthcare_realtime_soda"

          content = path.read_text()
          assert "111111111111" not in content
          assert "task-definition/" not in content
          assert "healthcare_realtime_dbt:42" not in content
          assert "healthcare_realtime_soda:17" not in content

          print("MWAA Serverless workflow validation passed.")
          PY
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: |
          terraform test -filter=tests/ci_plan.tftest.hcl

  synthea_changes:
    name: Detect Synthea Changes
    runs-on: ubuntu-latest

    outputs:
      synthea: ${{ steps.filter.outputs.synthea }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            synthea:
              - "scripts/synthea_loader/**"
              - "requirements_dev.txt"
              - ".github/workflows/ci.yml"

  synthea:
    name: Synthea FHIR Generation
    needs:
      - synthea_changes
    if: needs.synthea_changes.outputs.synthea == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Synthea checkout
        id: synthea_cache
        uses: actions/cache@v5
        with:
          path: scripts/synthea_loader/synthea
          key: synthea-${{ runner.os }}-java17-${{ hashFiles('scripts/synthea_loader/synthea_version.txt') }}

      - name: Install Synthea
        if: steps.synthea_cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/synthea_loader/scripts/install.sh

      - name: Verify cached Synthea
        if: steps.synthea_cache.outputs.cache-hit == 'true'
        run: |
          test -x scripts/synthea_loader/synthea/run_synthea
          echo "Cached Synthea checkout restored successfully."

      - name: Generate test patient
        run: |
          POPULATION=1 SEED=12345 ./scripts/synthea_loader/scripts/generate.sh

      - name: Inspect generated FHIR
        run: |
          find scripts/synthea_loader/synthea/output/fhir -maxdepth 1 -type f | sort

      - name: Run Synthea output tests
        run: |
          python -m pytest scripts/synthea_loader/tests/test_synthea_output.py -v

  containers:
    name: Container Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build dbt image
        run: |
          docker build \
            --platform linux/amd64 \
            -f deploy/dbt/Dockerfile \
            -t healthcare-realtime-dbt:test \
            .

      - name: Build Soda image
        run: |
          docker build \
            --platform linux/amd64 \
            -f deploy/soda/Dockerfile \
            -t healthcare-realtime-soda:test \
            .

      - name: Build vitals simulator image
        run: |
          docker build \
            --platform linux/amd64 \
            -f services/vitals_simulator/Dockerfile \
            -t healthcare-realtime-vitals-simulator:test \
            .
