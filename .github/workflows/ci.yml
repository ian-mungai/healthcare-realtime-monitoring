name: CI

on:
  workflow_dispatch:

  pull_request:

  push:
    branches:
      - main

jobs:
  python:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt

      - name: Soda contract syntax
        run: |
          for contract in data_quality/soda/contracts/*.yml; do
            soda contract test --contract "$contract"
          done
      - name: Ruff
        run: |
          ruff check .

      - name: Project tests
        run: |
          python -m pytest tests -v

      - name: FHIR loader unit tests
        run: |
          python -m pytest scripts/synthea_loader/tests/test_load_fhir.py -v
      - name: FHIR webhook tests
        run: |
          python -m pytest services/fhir_webhook/tests -v
      - name: Vitals simulator tests
        run: |
          python -m pytest services/vitals_simulator/tests -v
      - name: Vitals stream processor tests
        run: |
          python -m pytest services/vitals_stream_processor/tests -v
      - name: Vitals replay tests
        run: |
          python -m pytest services/vitals_replay/tests -v

  terraform:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.0"

      - name: Terraform Format
        run: |
          terraform fmt -check -recursive infra
      - name: Build Glue lineage package
        run: |
          ./scripts/glue/build_lineage_package.sh

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra
        run: |
          terraform validate

  synthea_changes:
    name: Detect Synthea Changes
    runs-on: ubuntu-latest

    outputs:
      synthea: ${{ steps.filter.outputs.synthea }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            synthea:
              - "scripts/synthea_loader/**"
              - "requirements_dev.txt"
              - ".github/workflows/ci.yml"

  synthea:
    name: Synthea FHIR Generation
    needs:
      - synthea_changes
    if: needs.synthea_changes.outputs.synthea == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Synthea checkout
        id: synthea_cache
        uses: actions/cache@v5
        with:
          path: scripts/synthea_loader/synthea
          key: synthea-${{ runner.os }}-java17-${{ hashFiles('scripts/synthea_loader/synthea_version.txt') }}

      - name: Install Synthea
        if: steps.synthea_cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/synthea_loader/scripts/install.sh

      - name: Verify cached Synthea
        if: steps.synthea_cache.outputs.cache-hit == 'true'
        run: |
          test -x scripts/synthea_loader/synthea/run_synthea
          echo "Cached Synthea checkout restored successfully."

      - name: Generate test patient
        run: |
          POPULATION=1 SEED=12345 ./scripts/synthea_loader/scripts/generate.sh

      - name: Inspect generated FHIR
        run: |
          find scripts/synthea_loader/synthea/output/fhir -maxdepth 1 -type f | sort

      - name: Run Synthea output tests
        run: |
          python -m pytest scripts/synthea_loader/tests/test_synthea_output.py -v

  containers:
    name: Container Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build dbt image
        run: |
          docker build \
            --platform linux/amd64 \
            -f deploy/dbt/Dockerfile \
            -t healthcare-realtime-dbt:test \
            .

      - name: Build Soda image
        run: |
          docker build \
            --platform linux/amd64 \
            -f deploy/soda/Dockerfile \
            -t healthcare-realtime-soda:test \
            .

      - name: Build vitals simulator image
        run: |
          docker build \
            --platform linux/amd64 \
            -f services/vitals_simulator/Dockerfile \
            -t healthcare-realtime-vitals-simulator:test \
            .
