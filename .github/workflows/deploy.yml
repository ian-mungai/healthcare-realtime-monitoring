name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: healthcare-realtime-development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform ${{ inputs.action }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Validate protected configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TERRAFORM_VARIABLES_JSON: ${{ secrets.TERRAFORM_VARIABLES_JSON }}
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$TF_STATE_BUCKET"
          test -n "$TERRAFORM_VARIABLES_JSON"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: healthcare-realtime-github-deploy

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.0"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r airflow/serverless/requirements_dev.txt

      - name: Configure private Terraform inputs
        env:
          TERRAFORM_VARIABLES_JSON: ${{ secrets.TERRAFORM_VARIABLES_JSON }}
        run: |
          printf '%s' "$TERRAFORM_VARIABLES_JSON" > infra/deployment.auto.tfvars.json
          jq -e . infra/deployment.auto.tfvars.json >/dev/null
          echo "OPENLINEAGE_URL=$(jq -r '.openlineage_collector_url // ""' infra/deployment.auto.tfvars.json)" >> "$GITHUB_ENV"

      - name: Initialize Terraform state
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform-state/development/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Build deployment packages
        run: |
          for builder in scripts/lambda/build_*.sh; do
            "$builder"
          done
          ./scripts/glue/build_lineage_package.sh
          ./airflow/serverless/convert_healthcare_realtime_pipeline.sh
          ./airflow/serverless/build_code_package.sh

      - name: Validate Terraform
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra validate

      - name: Create reviewed plan
        run: |
          terraform -chdir=infra plan -out=tfplan-deploy
          terraform -chdir=infra show -no-color tfplan-deploy > "$RUNNER_TEMP/tfplan.txt"
          cat "$RUNNER_TEMP/tfplan.txt"

      - name: Apply reviewed plan
        if: inputs.action == 'apply'
        run: |
          terraform -chdir=infra apply tfplan-deploy

      - name: Verify convergence
        if: inputs.action == 'apply'
        run: |
          terraform -chdir=infra plan -detailed-exitcode
