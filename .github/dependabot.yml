version: 2

updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/airflow"
      - "/airflow/serverless"
      - "/dashboard"
      - "/services/vitals_simulator"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - "/infra"
      - "/infra/bootstrap"
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/deploy/dbt"
      - "/deploy/marquez"
      - "/deploy/soda"
      - "/services/vitals_simulator"
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns:
          - "*"
