# The dashboards rendered for one warehouse (scripts/grafana/render_dashboards.py): mounted by the local stack, copied
# into the AWS image (deploy/grafana/Dockerfile). Edit their sources in deploy/grafana/dashboards/, not in Grafana.
apiVersion: 1

providers:
  - name: healthcare-realtime
    orgId: 1
    folder: Healthcare Realtime
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
