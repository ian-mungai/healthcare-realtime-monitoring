[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "."
]

[tool.coverage.run]
source = [
    "dashboard",
    "data_quality",
    "jobs",
    "lineage",
    "scripts",
    "services",
]
omit = [
    "*/tests/*",
    "scripts/synthea_loader/synthea/*",
]

[tool.coverage.report]
fail_under = 68
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    "^airflow/",
    "^build/",
    "^tmp/",
    "^\\.venv/",
    "^scripts/synthea_loader/synthea/",
]
